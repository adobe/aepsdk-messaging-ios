name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag/version'
        required: true
        default: '5.0.0'

      action_tag:
        description: 'create tag? ("no" to skip)'
        required: true
        default: 'yes'

      release_AEPMessaging:
        description: 'release AEPMessaging pod? ("no" to skip)'
        required: true
        default: 'yes'

      release_AEPMessagingLiveActivity:
        description: 'release AEPMessagingLiveActivity pod? ("no" to skip)'
        required: true
        default: 'yes'

      release_AEPMessagingNotification:
        description: 'release AEPMessagingNotification pod? ("no" to skip)'
        required: true
        default: 'yes'

jobs:
  release_messaging:
    runs-on: macos-15
    # Least-privilege token scopes. contents: write is required for the release step to create/
    # update the GH release and upload the XCFramework archives.
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v2
      with:
        ref: main
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4.0'
    
    - name: Install jq
      run: brew install jq

    - name: Install cocoapods 
      run: gem install cocoapods
      
    - name: Install xcodegen
      run: brew install xcodegen

    - name: Check version in Podspec
      run: |
        set -eo pipefail
        echo Verifying AEPMessaging, AEPMessagingLiveActivity and AEPMessagingNotification version is: ${{ github.event.inputs.tag }}
        make check-version VERSION=${{ github.event.inputs.tag }}
    
    - name: Pod repo update
      run: | 
        pod repo update
    
    - name: SPM integration test
      if: ${{ github.event.inputs.action_tag == 'yes' }}
      run: |
        set -eo pipefail
        echo SPM integration test starts:
        make test-SPM-integration
  
    - name: podspec file verification
      if: ${{ github.event.inputs.action_tag == 'yes' }}
      run: |
        set -eo pipefail
        echo podspec file verification starts:
        make test-podspec

    - name: Build Artifacts
      if: ${{ github.event.inputs.action_tag == 'yes' }}
      run: |
        make archive
        make zip

    # Give the XCFramework archives their versioned names before upload (preserves the naming
    # used by prior releases, e.g. AEPMessaging-5.16.0.xcframework.zip).
    - name: Rename XCFramework archives with version
      if: ${{ github.event.inputs.action_tag == 'yes' }}
      run: |
        set -eo pipefail
        cd build
        cp AEPMessaging.xcframework.zip "AEPMessaging-${{ github.event.inputs.tag }}.xcframework.zip"
        cp AEPMessagingLiveActivity.xcframework.zip "AEPMessagingLiveActivity-${{ github.event.inputs.tag }}.xcframework.zip"
        cp AEPMessagingNotification.xcframework.zip "AEPMessagingNotification-${{ github.event.inputs.tag }}.xcframework.zip"

    # Idempotent release: creates the GH release for the tag, or UPDATES it if the tag/release
    # already exists, and uploads all three XCFramework archives in one step (overwriting existing
    # assets of the same name). This replaces the previous release-drafter + three
    # upload-release-asset@v1 steps, which hard-failed with
    #   HttpError: Validation Failed: {"resource":"Release","code":"already_exists","field":"tag_name"}
    # whenever the tag already existed — leaving `upload_url` empty and cascading into
    # "Input required and not supplied: upload_url" on every upload step. With create-or-update
    # semantics, re-running the release for an existing version no longer fails.
    - name: Create GH release and upload XCFramework archives
      if: ${{ github.event.inputs.action_tag == 'yes' }}
      uses: softprops/action-gh-release@v2
      with:
        name: v${{ github.event.inputs.tag }}
        tag_name: ${{ github.event.inputs.tag }}
        target_commitish: main
        generate_release_notes: true
        make_latest: "true"
        files: |
          ./build/AEPMessaging-${{ github.event.inputs.tag }}.xcframework.zip
          ./build/AEPMessagingLiveActivity-${{ github.event.inputs.tag }}.xcframework.zip
          ./build/AEPMessagingNotification-${{ github.event.inputs.tag }}.xcframework.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish Pods - AEPMessagingNotification
      if: ${{ github.event.inputs.release_AEPMessagingNotification == 'yes' }}
      run: |
        set -eo pipefail
        pod trunk push AEPMessagingNotification.podspec --allow-warnings --synchronous
      env:
        COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

    - name: Publish Pods - AEPMessagingLiveActivity
      if: ${{ github.event.inputs.release_AEPMessagingLiveActivity == 'yes' }}
      run: |
        set -eo pipefail
        pod trunk push AEPMessagingLiveActivity.podspec --allow-warnings --synchronous
      env:
        COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}

    - name: Publish Pods - AEPMessaging
      if: ${{ github.event.inputs.release_AEPMessaging == 'yes' }}
      run: |
        set -eo pipefail
        pod trunk push AEPMessaging.podspec --allow-warnings --synchronous
      env:
        COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
