# AEPMessaging iOS Smoke Tests — parsed from wiki (Verification column: Android; adapted for iOS)
# Platform: iOS | Simulator: iPhone Air iOS 26.5
# AUTO_MODE: true | ASSURANCE: skipped

- id: 1
  name: "Push Notification — Display"
  category: push
  categoryLabel: "Push"
  description: "Verify push notification is delivered to device and Push Notification Displayed event dispatched"
  preConditions: "Physical device, Assurance connected, push capability"
  steps: ["Connect app to Assurance", "Use push debug view to send push notification", "Verify notification delivered"]
  action_type: assurance_check
  ui_elements: []
  expected_patterns: ["Push Notification Displayed"]
  needs_assurance: true
  needs_aep_query: false
  needs_prior_state: false
  skip_reason: "Push notifications not available on iOS simulator; requires physical device"

- id: 2
  name: "Push Notification — Tracking"
  category: push
  categoryLabel: "Push"
  description: "Verify local notification delivered and push tracking events dispatched"
  preConditions: "Push capability, notification permissions granted"
  steps: ["Click 'Get Local Notification' button", "Click on notification"]
  action_type: button_tap
  ui_elements: ["Get Local Notification"]
  expected_patterns: ["pushTracking.applicationOpened"]
  needs_assurance: false
  needs_aep_query: false
  needs_prior_state: false
  skip_reason: "No 'Get Local Notification' button in iOS PushView; push tracking not verifiable on simulator"

