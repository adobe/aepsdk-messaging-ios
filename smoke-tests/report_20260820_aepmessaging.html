<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDK Smoke Test Report</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #eb1000; --red-dark: #b50d00;
      --pass: #1a7f4b; --pass-bg: #e6f4ed;
      --fail: #b91c1c; --fail-bg: #fef2f2;
      --text: #1a1a1a; --text-muted: #6b7280;
      --border: #e5e7eb; --bg: #f9fafb; --card: #ffffff;
      --code-bg: #0f1117; --code-text: #e2e8f0; --highlight: #fbbf24;
      --platform-color: #3b82f6;
    }
    /* Platform-specific accent colours injected by JS */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

    /* ── Header ── */
    header { background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); color: #fff; padding: 32px 40px 28px; border-bottom: 3px solid var(--red); }
    header .top-row { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
    header .logo { display: flex; align-items: center; gap: 12px; }
    header .logo svg { flex-shrink: 0; }
    header .logo span { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #9ca3af; }
    header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    header .subtitle { font-size: 14px; color: #9ca3af; }
    header .meta { display: flex; gap: 24px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
    header .meta-item { font-size: 13px; color: #9ca3af; }
    header .meta-item strong { color: #e5e7eb; }

    /* ── Platform badge ── */
    .platform-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.03em;
      border: 2px solid; flex-shrink: 0;
    }
    .platform-badge .platform-icon { font-size: 16px; line-height: 1; }
    /* Colours set by JS based on platform_key */
    .platform-badge.android  { background: rgba(61,220,132,.15); border-color: #3ddc84; color: #3ddc84; }
    .platform-badge.ios      { background: rgba(147,197,253,.15); border-color: #93c5fd; color: #93c5fd; }
    .platform-badge.react-native-android { background: rgba(97,218,251,.15); border-color: #61dafb; color: #61dafb; }
    .platform-badge.react-native-ios     { background: rgba(97,218,251,.15); border-color: #61dafb; color: #61dafb; }

    /* ── Summary cards ── */
    main { max-width: 1100px; margin: 0 auto; padding: 36px 24px 80px; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 36px; }
    .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .summary-card .value { font-size: 38px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
    .summary-card .label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .summary-card.total .value { color: var(--text); }
    .summary-card.pass  .value { color: var(--pass); }
    .summary-card.fail  .value { color: var(--fail); }
    .summary-card.skip  .value { color: #d97706; }

    /* ── Platform info bar ── */
    .platform-bar {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 20px; margin-bottom: 36px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      border-left: 4px solid var(--platform-color);
    }
    .platform-bar .pb-icon { font-size: 22px; }
    .platform-bar .pb-label { font-size: 14px; font-weight: 600; color: var(--text); }
    .platform-bar .pb-meta { font-size: 13px; color: var(--text-muted); margin-left: auto; }

    /* ── Test table ── */
    .section-heading { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 40px; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: #f3f4f6; padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f0f4ff; }
    tbody tr.active { background: #eff6ff; }
    td { padding: 14px 16px; font-size: 14px; vertical-align: middle; }
    td.num { width: 52px; font-weight: 700; color: var(--text-muted); text-align: center; }
    td.name { font-weight: 600; }
    td.category span { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #e0e7ff; color: #3730a3; }
    td.category span.cat-privacy   { background: #fce7f3; color: #9d174d; }
    td.category span.cat-lifecycle { background: #dcfce7; color: #14532d; }
    td.category span.cat-setup     { background: #f1f5f9; color: #475569; }
    td.category span.cat-tracking  { background: #fef9c3; color: #854d0e; }
    td.category span.cat-playback  { background: #dcfce7; color: #14532d; }
    td.category span.cat-config    { background: #ede9fe; color: #4c1d95; }
    td.category span.cat-identity  { background: #fff7ed; color: #9a3412; }
    td.category span.cat-signal    { background: #ede9fe; color: #4c1d95; }

    /* Assurance / AEP indicator dots */
    td.indicators { width: 80px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .dot.assurance { background: #8b5cf6; }
    .dot.aep       { background: #f59e0b; }
    .dot.none      { background: #e5e7eb; }

    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .03em; }
    .badge.pass { background: var(--pass-bg); color: var(--pass); }
    .badge.fail { background: var(--fail-bg); color: var(--fail); }
    .badge.pass::before { content: "✓"; }
    .badge.fail::before { content: "✗"; }
    td.arrow { width: 40px; text-align: center; color: #9ca3af; font-size: 16px; }
    tbody tr:hover td.arrow { color: var(--red); }

    /* ── Drawer ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100; }
    .overlay.open { display: block; }
    .drawer { position: fixed; top: 0; right: -760px; width: min(760px, 100vw); height: 100vh; background: var(--card); z-index: 101; display: flex; flex-direction: column; box-shadow: -4px 0 32px rgba(0,0,0,.18); transition: right 0.28s cubic-bezier(.4,0,.2,1); overflow: hidden; }
    .drawer.open { right: 0; }
    .drawer-header { flex-shrink: 0; background: #1a1a1a; color: #fff; padding: 20px 24px 16px; border-bottom: 2px solid var(--red); }
    .drawer-header .drawer-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .drawer-header .drawer-id { font-size: 12px; font-weight: 700; color: #9ca3af; letter-spacing: .06em; text-transform: uppercase; }
    .drawer-header h2 { font-size: 19px; font-weight: 700; }
    .drawer-close { position: absolute; top: 18px; right: 20px; background: none; border: none; color: #9ca3af; font-size: 22px; cursor: pointer; line-height: 1; padding: 4px 8px; border-radius: 6px; }
    .drawer-close:hover { background: #333; color: #fff; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 24px; }
    .detail-section { margin-bottom: 28px; }
    .detail-section h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    .detail-section p, .detail-section li { font-size: 14px; color: var(--text); }
    .detail-section ul, .detail-section ol { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

    /* Validation tags in drawer */
    .validation-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .vtag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .vtag.assurance-ok  { background: #ede9fe; color: #5b21b6; }
    .vtag.assurance-no  { background: #fef2f2; color: #991b1b; }
    .vtag.aep-ok        { background: #fef9c3; color: #92400e; }
    .vtag.aep-no        { background: #fef2f2; color: #991b1b; }
    .vtag.aep-pending   { background: #f0fdf4; color: #166534; }
    .vtag.platform      { background: #f0f9ff; color: #0369a1; }

    .code-block { background: var(--code-bg); color: var(--code-text); border-radius: 8px; padding: 16px 18px; font-family: "SF Mono", "Fira Code", Consolas, monospace; font-size: 11.5px; line-height: 1.65; overflow-x: auto; white-space: pre; }
    .code-block .hl        { color: var(--highlight); font-weight: 600; }
    .code-block .dim       { color: #4b5563; }
    .code-block .pass-line { color: #4ade80; }
    .code-block .url-line  { color: #60a5fa; }
    .conclusion-box { background: var(--pass-bg); border-left: 4px solid var(--pass); border-radius: 6px; padding: 14px 16px; font-size: 14px; color: #14532d; line-height: 1.6; }
    .conclusion-box.fail { background: var(--fail-bg); border-color: var(--fail); color: #7f1d1d; }

    /* ── Overall summary ── */
    .overall-summary { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    .overall-summary h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
    .overall-summary p { font-size: 14px; margin-bottom: 10px; line-height: 1.7; }
    .overall-summary ul { margin: 10px 0 10px 20px; display: flex; flex-direction: column; gap: 6px; }
    .overall-summary li { font-size: 14px; }

    footer { text-align: center; padding: 24px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); }

    /* Legend */
    .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
  </style>
</head>
<body>
<header>
  <div class="top-row">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 100 100" fill="none">
        <rect width="100" height="100" rx="8" fill="#eb1000"/>
        <path d="M57.5 20L82 80H67L62 65H48L43 80H28L52.5 20H57.5Z" fill="white"/>
        <path d="M52.5 40L59 58H46L52.5 40Z" fill="#eb1000"/>
      </svg>
      <span>Adobe Experience Platform</span>
    </div>
    <div id="hdr-platform-badge"></div>
  </div>
  <h1 id="hdr-title"></h1>
  <p class="subtitle" id="hdr-subtitle"></p>
  <div class="meta" id="hdr-meta"></div>
</header>

<main>
  <div id="platform-bar" class="platform-bar">
    <span class="pb-icon" id="pb-icon"></span>
    <span class="pb-label" id="pb-label"></span>
    <span class="pb-meta" id="pb-meta"></span>
  </div>

  <div class="summary">
    <div class="summary-card total"><div class="value" id="cnt-total">—</div><div class="label">Total Tests</div></div>
    <div class="summary-card pass"> <div class="value" id="cnt-pass">—</div> <div class="label">Passed</div></div>
    <div class="summary-card fail"> <div class="value" id="cnt-fail">—</div> <div class="label">Failed</div></div>
    <div class="summary-card skip"> <div class="value" id="cnt-skip">—</div> <div class="label">Skipped</div></div>
  </div>

  <div class="section-heading">Test Cases</div>
  <div class="legend">
    <span>Legend:</span>
    <span class="legend-item"><span class="dot assurance"></span> Assurance validated</span>
    <span class="legend-item"><span class="dot aep"></span> AEP dataset validated</span>
    <span class="legend-item"><span class="dot none"></span> Log-only</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Test Name</th>
          <th>Category</th>
          <th>Validation</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="test-table-body"></tbody>
    </table>
  </div>

  <div class="section-heading">Overall Summary</div>
  <div class="overall-summary">
    <h2 id="os-heading"></h2>
    <div id="os-body"></div>
  </div>
</main>

<footer id="footer-text"></footer>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-meta">
      <span class="drawer-id" id="drawer-id"></span>
      <span id="drawer-badge"></span>
      <span id="drawer-platform-tag"></span>
    </div>
    <h2 id="drawer-title"></h2>
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</div>

/* ── Platform config ── */
const PLATFORM_CONFIG = {
  "android": {
    icon: "🤖",
    label: "Android",
    color: "#3ddc84",
    cssVar: "#3ddc84",
    badgeClass: "android"
  },
  "ios": {
    icon: "",
    label: "iOS",
    color: "#93c5fd",
    cssVar: "#93c5fd",
    badgeClass: "ios"
  },
  "react-native-android": {
    icon: "⚛️",
    label: "React Native (Android)",
    color: "#61dafb",
    cssVar: "#61dafb",
    badgeClass: "react-native-android"
  },
  "react-native-ios": {
    icon: "⚛️",
    label: "React Native (iOS)",
    color: "#61dafb",
    cssVar: "#61dafb",
    badgeClass: "react-native-ios"
  }
};

(function init() {
  const d = REPORT_DATA;
  const platformKey = (d.metadata.platform_key || "android").toLowerCase();
  const pc = PLATFORM_CONFIG[platformKey] || PLATFORM_CONFIG["android"];

  // Inject platform colour as CSS variable
  document.documentElement.style.setProperty("--platform-color", pc.color);

  // Header
  document.title = d.metadata.title;
  document.getElementById("hdr-title").textContent    = d.metadata.title;
  document.getElementById("hdr-subtitle").textContent = d.metadata.subtitle;

  // Platform badge in header
  document.getElementById("hdr-platform-badge").innerHTML =
    `<div class="platform-badge ${pc.badgeClass}">
       <span class="platform-icon">${pc.icon}</span>
       <span>${pc.label}</span>
     </div>`;

  // Meta row
  const metaItems = [
    { label: "Extension", value: d.metadata.extension },
    { label: "Platform",  value: d.metadata.platform  },
    { label: "Tested",    value: d.metadata.date       },
    ...(d.metadata.extra_meta || [])
  ];
  document.getElementById("hdr-meta").innerHTML = metaItems
    .map(m => `<div class="meta-item"><strong>${m.label}:</strong> ${m.value}</div>`).join("");

  // Platform info bar
  document.getElementById("pb-icon").textContent  = pc.icon;
  document.getElementById("pb-label").textContent = `Platform: ${pc.label}`;
  const assuranceMeta = (d.metadata.extra_meta || []).find(m => m.label === "Assurance");
  const configMeta    = (d.metadata.extra_meta || []).find(m => m.label === "Config ID");
  const pbParts = [];
  if (configMeta) pbParts.push(`Config: ${configMeta.value}`);
  if (assuranceMeta) pbParts.push(`Assurance: ${assuranceMeta.value}`);
  document.getElementById("pb-meta").textContent = pbParts.join("  ·  ");

  // Summary counts
  document.getElementById("cnt-total").textContent = d.summary.total;
  document.getElementById("cnt-pass").textContent  = d.summary.pass;
  document.getElementById("cnt-fail").textContent  = d.summary.fail;
  document.getElementById("cnt-skip").textContent  = d.summary.skip;

  // Test table
  const tbody = document.getElementById("test-table-body");
  d.tests.forEach(t => {
    const hasAssurance = t.assuranceValidated === true || t.assuranceValidated === false;
    const hasAep       = t.aepValidated === true || t.aepValidated === false || t.aepValidated === "pending";
    const assuranceDot = hasAssurance
      ? `<span class="dot assurance" title="Assurance validated"></span>`
      : `<span class="dot none" title="No Assurance"></span>`;
    const aepDot = hasAep
      ? `<span class="dot aep" title="AEP dataset validated"></span>`
      : `<span class="dot none" title="No AEP query"></span>`;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="num">${t.id}</td>
      <td class="name">${t.name}</td>
      <td class="category"><span class="cat-${t.category}">${t.categoryLabel}</span></td>
      <td class="indicators">${assuranceDot}${aepDot}</td>
      <td><span class="badge ${t.status}">${t.status.toUpperCase()}</span></td>
      <td class="arrow">›</td>`;
    tr.addEventListener("click", () => openDrawer(t.id));
    tbody.appendChild(tr);
  });

  // Overall summary
  document.getElementById("os-heading").textContent = d.overall_summary.heading;
  let osHtml = (d.overall_summary.paragraphs || []).map(p => `<p>${p}</p>`).join("");
  if (d.overall_summary.bullets && d.overall_summary.bullets.length)
    osHtml += `<ul>${d.overall_summary.bullets.map(b => `<li>${b}</li>`).join("")}</ul>`;
  document.getElementById("os-body").innerHTML = osHtml;

  document.getElementById("footer-text").textContent = d.footer;
})();

function openDrawer(id) {
  const t = REPORT_DATA.tests.find(x => x.id === id);
  if (!t) return;

  const platformKey = (REPORT_DATA.metadata.platform_key || "android").toLowerCase();
  const pc = PLATFORM_CONFIG[platformKey] || PLATFORM_CONFIG["android"];

  document.querySelectorAll("tbody tr").forEach(r => r.classList.remove("active"));
  const rows = document.querySelectorAll("tbody tr");
  if (rows[id - 1]) rows[id - 1].classList.add("active");

  document.getElementById("drawer-id").textContent = `TEST ${String(t.id).padStart(2,"0")}`;
  document.getElementById("drawer-title").textContent = t.name;
  document.getElementById("drawer-badge").innerHTML =
    `<span class="badge ${t.status}">${t.status.toUpperCase()}</span>`;
  document.getElementById("drawer-platform-tag").innerHTML =
    `<span class="vtag platform">${pc.icon} ${t.platform || pc.label}</span>`;

  // Validation tags
  let validationHtml = '<div class="validation-row">';
  if (t.assuranceValidated === true)
    validationHtml += '<span class="vtag assurance-ok">● Assurance ✓</span>';
  else if (t.assuranceValidated === false)
    validationHtml += '<span class="vtag assurance-no">● Assurance ✗</span>';
  if (t.aepValidated === true)
    validationHtml += '<span class="vtag aep-ok">◆ AEP Dataset ✓</span>';
  else if (t.aepValidated === false)
    validationHtml += '<span class="vtag aep-no">◆ AEP Dataset ✗</span>';
  else if (t.aepValidated === "pending")
    validationHtml += '<span class="vtag aep-pending">◆ AEP Pending</span>';
  validationHtml += '</div>';

  document.getElementById("drawer-body").innerHTML = `
    ${(t.assuranceValidated != null || t.aepValidated != null)
        ? `<div class="detail-section"><h3>Validation</h3>${validationHtml}</div>`
        : ""}
    <div class="detail-section"><h3>Description</h3><p>${t.description}</p></div>
    <div class="detail-section"><h3>Pre-conditions</h3><p>${t.preConditions}</p></div>
    <div class="detail-section"><h3>Test Steps</h3><ol>${t.steps.map(s => `<li>${s}</li>`).join("")}</ol></div>
    <div class="detail-section"><h3>${t.logTitle || "Conclusive Log Evidence"}</h3><div class="code-block">${t.logcat}</div></div>
    <div class="detail-section"><h3>Conclusion</h3><div class="conclusion-box ${t.status === 'fail' ? 'fail' : ''}">${t.conclusion}</div></div>`;

  document.getElementById("drawer").classList.add("open");
  document.getElementById("overlay").classList.add("open");
}

function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("overlay").classList.remove("open");
  document.querySelectorAll("tbody tr").forEach(r => r.classList.remove("active"));
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
</script>
